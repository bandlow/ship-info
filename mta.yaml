ID: ship-info
_schema-version: '3.2'
version: '0.1.0'

modules:
  # Backend Service
  - name: ship-info-srv
    type: nodejs
    path: srv
    requires:
      - name: ship-info-hana
      - name: ship-info-auth
    provides:
      - name: ship-info-srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      memory: 1G
      disk-quota: 2G
      buildpack: nodejs_buildpack
    properties:
      NODE_OPTIONS: "--max-old-space-size=512 --expose-gc"
    build-parameters:
      builder: npm-builder

  - name: ship-info-ui
    type: html5
    path: app/ship-info-app
    requires:
      - name: ship-info-srv
      - name: ship-info-html5-repo-host

  - name: ship-info-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 1G
    requires:
      - name: ship-info-hana

resources:
 
  - name: ship-info-hana
    type: com.sap.xs.hdi-container
    properties:
      hdi-container-name: ${service-name}
    parameters:
      service: hana
      service-plan: hdi-shared
      config:
        schema: SHIPINFO_DEV
        container_group: SHIPMANAGER
        database_id: 2d118d47-f07f-471c-b65c-98bdcbdb1c1e

  - name: ship-info-html5-repo-host
    type: com.sap.html5.htmlrepo
 
  - name: ship-info-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: ship-info-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: ship-info-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
