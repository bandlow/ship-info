ID: ship-info
_schema-version: '3.2'
version: ${project.version}

modules:
  - name: ship-info-srv
    type: nodejs
    path: srv
    requires:
      - name: ship-info-hana
    provides:
      - name: ship-info-srv_api
    parameters:
      memory: 256M
    build-parameters:
      builder: npm-builder

  - name: ship-info-ui
    type: html5
    path: app/ship-info-app
    requires:
      - name: ship-info-srv_api
      - name: ship-info-html5-repo-host
  - name: ship-info-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: ship-info-auth
      - name: ship-info-hana

  - name: ship-info-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: ship-info-db
      - name: ship-info-hana

resources:
  - name: ship-info-hana
    type: com.sap.xs.hdi-container
    properties:
      hdi-container-name: ${service-name}
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: ship-info-html5-repo-host
    type: com.sap.html5.htmlrepo
  - name: ship-info-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: ship-info-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
description: "Ship Information API based on LLoyds MDB"
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
