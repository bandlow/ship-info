ID: ship-info
_schema-version: '3.2'
version: "1.0.0"
description: "Ship Information API based on Lloyd's MDB"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  # Backend Service
  - name: ship-info-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: ship-info-hana
      - name: ship-info-auth
    provides:
      - name: ship-info-srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      memory: 1G
      disk-quota: 2G
      buildpack: nodejs_buildpack
    properties:
      NODE_OPTIONS: "--max-old-space-size=512 --expose-gc"
    build-parameters:
      builder: npm-ci
      ignore:
        - node_modules/
        - .env
        - default-env.json
        - test/

  # Database Deployer
  - name: ship-info-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 1G
    requires:
      - name: ship-info-hana

resources:
  # HANA HDI Container
  - name: ship-info-hana
    type: com.sap.xs.hdi-container
    properties:
      hdi-container-name: ${service-name}
    parameters:
      service: hana
      service-plan: hdi-shared
      config:
        schema: SHIP_INFO

  # XSUAA Authentication
  - name: ship-info-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: ship-info-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
